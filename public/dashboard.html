<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVU · Tareas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #F5F2EE; min-height: 100vh; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 60%, #388E3C 100%);
    padding: 18px 20px; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 15px; font-weight: 800; color: white; letter-spacing: 0.5px; }
  .header p  { font-size: 11px; color: #A5D6A7; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 7px 14px; border-radius: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.3); }

  /* SETUP */
  .setup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .setup-card {
    background: white; border-radius: 20px; padding: 32px 28px;
    width: 100%; max-width: 400px; box-shadow: 0 16px 60px rgba(0,0,0,0.3);
  }
  .setup-card h2 { font-size: 20px; color: #1B5E20; margin-bottom: 8px; }
  .setup-card p  { font-size: 13px; color: #795548; margin-bottom: 20px; line-height: 1.5; }
  .setup-card input {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid #D7CCC8;
    font-size: 14px; outline: none; margin-bottom: 14px; font-family: inherit;
    background: #FAFAFA;
  }
  .setup-card input:focus { border-color: #2E7D32; }
  .setup-btn {
    width: 100%; padding: 13px; border-radius: 10px; background: #1B5E20;
    border: none; color: white; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .setup-btn:disabled { background: #BDBDBD; cursor: not-allowed; }

  /* FILTERS */
  .filters {
    padding: 14px 16px; display: flex; gap: 8px; flex-wrap: wrap;
    background: white; border-bottom: 1px solid #E8E0D8; position: sticky; top: 65px; z-index: 9;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid #D7CCC8;
    background: white; color: #5D4037; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .filter-btn.active { background: #1B5E20; border-color: #1B5E20; color: white; }
  .filter-sep { width: 1px; background: #D7CCC8; margin: 2px 4px; }

  /* STATS */
  .stats {
    display: flex; gap: 10px; padding: 14px 16px; flex-wrap: wrap;
  }
  .stat-card {
    background: white; border-radius: 12px; padding: 12px 16px;
    flex: 1; min-width: 100px; border: 1px solid #E8E0D8;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: #1B5E20; }
  .stat-card .lbl { font-size: 11px; color: #795548; margin-top: 2px; }

  /* TASK CARDS */
  .tasks { padding: 0 16px 80px; display: flex; flex-direction: column; gap: 10px; }
  .task-card {
    background: white; border-radius: 14px; padding: 16px;
    border: 1.5px solid #E8E0D8; transition: all 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .task-card.completada {
    background: #F9F9F9; border-color: #E0E0E0; opacity: 0.7;
  }
  .task-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .task-tipo {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  }
  .task-desc {
    font-size: 14px; font-weight: 600; color: #212121; line-height: 1.4;
    margin-bottom: 10px;
  }
  .task-desc.completada { text-decoration: line-through; color: #9E9E9E; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag {
    display: flex; align-items: center; gap: 4px; padding: 3px 9px;
    background: #F5F2EE; border-radius: 20px; font-size: 11px; color: #5D4037;
  }
  .tag.urgencia-hoy    { background: #FFEBEE; color: #B71C1C; }
  .tag.urgencia-semana { background: #FFF3E0; color: #E65100; }
  .tag.urgencia-mes    { background: #E8F5E9; color: #2E7D32; }
  .tag.compromiso { background: #E3F2FD; color: #1565C0; font-weight: 700; }
  .task-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .task-registrador { font-size: 11px; color: #9E9E9E; }
  .completar-btn {
    padding: 7px 16px; border-radius: 20px; border: 1.5px solid;
    font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .completar-btn.pendiente {
    border-color: #2E7D32; color: #2E7D32; background: white;
  }
  .completar-btn.pendiente:hover { background: #2E7D32; color: white; }
  .completar-btn.hecha {
    border-color: #BDBDBD; color: #9E9E9E; background: #F5F5F5;
  }

  /* EMPTY / LOADING */
  .empty {
    text-align: center; padding: 60px 20px; color: #BCAAA4;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #E8E0D8;
    border-top-color: #2E7D32; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TIPO COLORS */
  .tipo-nueva_tarea       { background: #E3F2FD; color: #1565C0; }
  .tipo-propuesta_mejora  { background: #F3E5F5; color: #6A1B9A; }
  .tipo-compromiso        { background: #E8F5E9; color: #2E7D32; }
  .tipo-requerimiento_insumos { background: #FFF3E0; color: #E65100; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <span style="font-size:24px">🌿</span>
    <div>
      <h1>PARQUE VALLE LOS ULMOS</h1>
      <p id="subtitle">Tablero de Tareas</p>
    </div>
  </div>
  <div class="header-right">
    <button class="refresh-btn" onclick="loadTareas()">↻ Actualizar</button>
  </div>
</div>

<!-- SETUP MODAL -->
<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>🔑 Configurar acceso</h2>
    <p>Ingresa tu Token de API de KoboToolbox para acceder a las tareas del parque. Solo se pide una vez.</p>
    <input type="password" id="tokenInput" placeholder="Token de API..." oninput="checkToken()" />
    <button class="setup-btn" id="setupBtn" onclick="saveToken()" disabled>Conectar</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filters" id="filters" style="display:none">
  <button class="filter-btn active" data-filter="todos" onclick="setFilter('todos', this)">Todas</button>
  <button class="filter-btn" data-filter="pendientes" onclick="setFilter('pendientes', this)">Pendientes</button>
  <button class="filter-btn" data-filter="completadas" onclick="setFilter('completadas', this)">Completadas</button>
  <div class="filter-sep"></div>
  <button class="filter-btn" data-filter="Bárbara" onclick="setFilter('Bárbara', this)">Bárbara</button>
  <button class="filter-btn" data-filter="Roberto" onclick="setFilter('Roberto', this)">Roberto</button>
  <button class="filter-btn" data-filter="Joaquín" onclick="setFilter('Joaquín', this)">Joaquín</button>
  <button class="filter-btn" data-filter="Catalina" onclick="setFilter('Catalina', this)">Catalina</button>
  <button class="filter-btn" data-filter="Pablo" onclick="setFilter('Pablo', this)">Pablo</button>
</div>

<!-- STATS -->
<div class="stats" id="stats" style="display:none">
  <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
  <div class="stat-card"><div class="num" id="statPendientes">0</div><div class="lbl">Pendientes</div></div>
  <div class="stat-card"><div class="num" id="statCompletadas">0</div><div class="lbl">Completadas</div></div>
</div>

<!-- TASK LIST -->
<div class="tasks" id="tasks">
  <div class="loading"><div class="spinner"></div><p style="color:#9E9E9E;font-size:13px">Conectando...</p></div>
</div>

<script>
const PROXY = 'https://pvu-proxy.onrender.com';
let allTareas = [];
let currentFilter = 'todos';

// ── Token ────────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('pvu_dashboard_token') || ''; }
function checkToken() {
  document.getElementById('setupBtn').disabled = document.getElementById('tokenInput').value.trim().length < 20;
}
function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (t) { localStorage.setItem('pvu_dashboard_token', t); init(); }
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  const token = getToken();
  if (!token) {
    document.getElementById('setupOverlay').style.display = 'flex';
    document.getElementById('tasks').innerHTML = '';
  } else {
    document.getElementById('setupOverlay').style.display = 'none';
    document.getElementById('filters').style.display = 'flex';
    document.getElementById('stats').style.display = 'flex';
    loadTareas();
  }
}

// ── Load tareas ───────────────────────────────────────────────────────────────
async function loadTareas() {
  document.getElementById('tasks').innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:#9E9E9E;font-size:13px">Cargando tareas...</p></div>';
  const KOBO_UID = 'aXVyjPZ9YmmzGHaK6uHMdb';
  const url = `https://kf.kobotoolbox.org/api/v2/assets/${KOBO_UID}/submissions/?format=json&limit=500`;
  try {
    const res = await fetch(url, {
      headers: { Authorization: `Token ${getToken()}` }
    });
    if (!res.ok) throw new Error(`Kobo respondió ${res.status}`);
    const data = await res.json();
    const submissions = data.results || [];

    // Obtener completadas desde proxy
    let completadas = new Set();
    try {
      const cr = await fetch(`${PROXY}/api/completadas`);
      const cd = await cr.json();
      completadas = new Set(cd.map(String));
    } catch {}

    allTareas = submissions
      .filter(s => s.tipo_registro === 'tarea')
      .map(s => ({
        id: String(s._id),
        tipo: s.g1_tipo || '',
        descripcion: s.g2_descripcion || '',
        dirigido: s.g5_dirigido || '',
        urgencia: s.g4_urgencia || '',
        recursos: s.g6_recursos || '',
        registrador: s.registrador || '',
        fecha: s.a2_fecha || (s._submission_time || '').slice(0, 10),
        fecha_compromiso: s.g1b_compromiso_fecha || '',
        completada: completadas.has(String(s._id)),
      }));

    allTareas.sort((a, b) => {
      if (a.completada !== b.completada) return a.completada ? 1 : -1;
      return (b.fecha || '').localeCompare(a.fecha || '');
    });
    updateStats();
    render();
  } catch (err) {
    document.getElementById('tasks').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>Error al cargar: ${err.message}</p></div>`;
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const pendientes = allTareas.filter(t => !t.completada).length;
  document.getElementById('statTotal').textContent = allTareas.length;
  document.getElementById('statPendientes').textContent = pendientes;
  document.getElementById('statCompletadas').textContent = allTareas.length - pendientes;
}

// ── Filter ───────────────────────────────────────────────────────────────────
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFiltered() {
  const personas = ['Bárbara','Roberto','Joaquín','Catalina','Pablo'];
  return allTareas.filter(t => {
    if (currentFilter === 'pendientes') return !t.completada;
    if (currentFilter === 'completadas') return t.completada;
    if (personas.includes(currentFilter)) return (t.dirigido || '').includes(currentFilter);
    return true;
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const tareas = getFiltered();
  const container = document.getElementById('tasks');
  if (!tareas.length) {
    container.innerHTML = '<div class="empty"><div class="icon">✅</div><p>No hay tareas para este filtro</p></div>';
    return;
  }
  container.innerHTML = tareas.map(t => taskCard(t)).join('');
}

function tipoLabel(tipo) {
  const map = {
    nueva_tarea: 'Nueva Tarea',
    propuesta_mejora: 'Propuesta de mejora',
    compromiso: 'Compromiso',
    requerimiento_insumos: 'Requerimiento de Insumos',
  };
  return map[tipo] || tipo;
}

function urgenciaClass(u) {
  if (!u) return '';
  if (u === 'hoy') return 'urgencia-hoy';
  if (u === 'semana') return 'urgencia-semana';
  if (u === 'mes') return 'urgencia-mes';
  return '';
}

function urgenciaLabel(u) {
  const map = { hoy: '🔴 Hoy', semana: '🟠 Esta semana', mes: '🟢 Este mes', sin_plazo: 'Sin plazo' };
  return map[u] || u;
}

function taskCard(t) {
  const dirigidos = (t.dirigido || '').split(' ').filter(Boolean);
  const tags = [
    t.urgencia ? `<span class="tag ${urgenciaClass(t.urgencia)}">${urgenciaLabel(t.urgencia)}</span>` : '',
    dirigidos.map(d => `<span class="tag">👤 ${d}</span>`).join(''),
    t.fecha_compromiso ? `<span class="tag compromiso">📅 Compromiso: ${t.fecha_compromiso}</span>` : '',
    t.recursos ? `<span class="tag">🔧 ${t.recursos}</span>` : '',
  ].filter(Boolean).join('');

  return `
    <div class="task-card ${t.completada ? 'completada' : ''}" id="card-${t.id}">
      <div class="task-card-top">
        <span class="task-tipo tipo-${t.tipo}">${tipoLabel(t.tipo)}</span>
        <span style="font-size:11px;color:#BCAAA4;white-space:nowrap">${t.fecha}</span>
      </div>
      <div class="task-desc ${t.completada ? 'completada' : ''}">${t.descripcion || '(sin descripción)'}</div>
      ${tags ? `<div class="task-meta">${tags}</div>` : ''}
      <div class="task-footer">
        <span class="task-registrador">por ${t.registrador || '—'}</span>
        <button class="completar-btn ${t.completada ? 'hecha' : 'pendiente'}"
          onclick="toggleCompletar('${t.id}', ${t.completada})">
          ${t.completada ? '↩ Reabrir' : '✓ Completar'}
        </button>
      </div>
    </div>`;
}

// ── Toggle completar ──────────────────────────────────────────────────────────
async function toggleCompletar(id, estaCompleta) {
  const method = estaCompleta ? 'DELETE' : 'POST';
  try {
    await fetch(`${PROXY}/api/tareas/${id}/completar`, { method });
    const tarea = allTareas.find(t => t.id === id);
    if (tarea) tarea.completada = !estaCompleta;
    updateStats();
    render();
  } catch (err) {
    alert('Error al actualizar: ' + err.message);
  }
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
